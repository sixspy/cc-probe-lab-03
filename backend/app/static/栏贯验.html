<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>栏贯验 · 探栏</title>
  <link rel="stylesheet" href="/styles.css"/>
  <script src="/common.js"></script>
</head>
<body>
  <div class="壳">
    <header class="顶牌">
      <h1>探栏</h1>
      <div class="骨">传感报文装载 → 标定/质控门槛入栏 → 站点汇总物化 → 坏点旁路 → 栏账互证<br/>皮：环境监测传感站 · 不是潮切关窗，也不是对拍双轨</div>
    </header>
    <div class="门槛条" id="门槛条"></div>
    <header class="顶牌" style="margin-bottom:10px">
      <h1 style="font-size:22px">栏贯验</h1>
      <div class="骨">已汇总缓冲与汇总账报文数互证。</div>
    </header>

    <section class="卷">
      <h2>批收口队列（在栏集合按批次可分）</h2>
      <div class="横排 下距12" id="收口概览"></div>
      <div class="表绕"><table><thead><tr><th>批次编号</th><th>时刻</th><th>收口</th><th>失败指纹</th><th>影子入流</th><th>现行观测</th><th>现行在栏</th><th>失败原因</th></tr></thead><tbody id="收口表"></tbody></table></div>
    </section>
    <section class="卷">
      <div class="工具"><button class="按钮" id="跑">跑栏贯验</button> <span id="果"></span></div>
      <div class="表绕"><table><thead><tr><th>时刻</th><th>在栏</th><th>汇总报文</th><th>坏点</th><th>结果</th><th>说明</th></tr></thead><tbody id="表"></tbody></table></div>
    </section>
    <script>
    async function 刷() {
      const 快照 = await 探栏.getJSON("/api/栏贯验/快照");
      const 撕裂 = 快照.收口撕裂 || [];
      document.getElementById("收口概览").innerHTML = [
        ["现行在栏", 快照.在栏],
        ["失败清回批", (快照.失败收口批 || []).length],
        ["收口撕裂", 撕裂.length],
      ].map(([k, v]) => {
        const 危 = k === "收口撕裂" && v > 0;
        return `<div class="水卡"><div class="数 ${危 ? "危字" : ""}">${v}</div><div class="标">${k}</div></div>`;
      }).join("");
      const 账 = await 探栏.getJSON("/api/装载批收口");
      const zb = document.getElementById("收口表");
      if (!账.length) {
        zb.innerHTML = `<tr><td colspan="8">${探栏.空态("尚无收口队列。")}</td></tr>`;
      } else {
        zb.innerHTML = "";
        for (const r of 账) {
          zb.appendChild(探栏.行(
            `<td>${探栏.安全文本(r.批次编号)}</td><td>${探栏.安全文本(r.时刻)}</td>` +
            `<td>${探栏.收口徽章(r.收口)}</td><td>${探栏.安全文本(r.失败指纹||"")}</td>` +
            `<td>${r.影子入流}</td><td>${r.现行观测}</td><td>${r.现行在栏}</td>` +
            `<td>${探栏.安全文本(r.失败原因||"")}</td>`
          ));
        }
      }
      const rows = await 探栏.getJSON("/api/栏贯验");
      const tb = document.getElementById("表"); tb.innerHTML = "";
      for (const r of rows) {
        const ok = r.是否对齐 ? 探栏.徽章("对齐","好") : 探栏.徽章("撕裂","危");
        tb.appendChild(探栏.行(`<td>${探栏.安全文本(r.时刻)}</td><td>${r.在栏笔数}</td><td>${r.汇总报文数}</td><td>${r.坏点笔数}</td><td>${ok}</td><td>${探栏.安全文本(r.说明)}</td>`));
      }
    }
    document.getElementById("跑").onclick = async () => {
      const d = await 探栏.postJSON("/api/栏贯验/跑");
      document.getElementById("果").innerHTML = d.是否对齐 ? 探栏.徽章("对齐","好") : 探栏.徽章("撕裂","危");
      await 刷();
    };
    刷();
    </script>

  </div>

  <nav class="底栏"><div class="底栏内">
    <a href="/" >探栏台</a>
    <a href="/报文流.html" >报文流</a>
    <a href="/入栏缓冲.html" >入栏缓冲</a>
    <a href="/站点汇总账.html" >站点汇总账</a>
    <a href="/坏点匣.html" >坏点匣</a>
    <a href="/栏贯验.html" class="亮">栏贯验</a>
    <a href="/站点源.html" >站点源</a>
    <a href="/栏规.html" >栏规</a>
  </div></nav>

  <script>
  (async () => {
    try {
      const o = await 探栏.getJSON("/api/概览");
      探栏.渲染门槛(document.getElementById("门槛条"), o.栏规 || {});
    } catch (e) {}
  })();
  </script>
</body>
</html>
