<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>入栏缓冲 · 探栏</title>
  <link rel="stylesheet" href="/styles.css"/>
  <script src="/common.js"></script>
</head>
<body>
  <div class="壳">
    <header class="顶牌">
      <h1>探栏</h1>
      <div class="骨">传感报文装载 → 标定/质控门槛入栏 → 站点汇总物化 → 坏点旁路 → 栏账互证<br/>皮：环境监测传感站 · 不是潮切关窗，也不是对拍双轨</div>
    </header>
    <div class="门槛条" id="门槛条"></div>
    <header class="顶牌" style="margin-bottom:10px">
      <h1 style="font-size:22px">入栏缓冲</h1>
      <div class="骨">过门槛、尚未结栏汇总的在途集合。</div>
    </header>

    <section class="卷">
      <div class="只读框 上距8" id="收口提示"></div>
      <div class="表绕"><table><thead><tr><th>报文编号</th><th>站点</th><th>指标</th><th>读数</th><th>栏号</th><th>批次</th><th>命运</th><th>批收口</th></tr></thead><tbody id="表"></tbody></table></div>
    </section>
    <script>
    (async () => {
      const 收口行 = await 探栏.getJSON("/api/装载批收口");
      const 批态 = {};
      for (const r of 收口行) 批态[r.批次编号] = r.收口;
      const 失败 = 收口行.filter((r) => r.收口 === "失败清回");
      document.getElementById("收口提示").innerHTML =
        `本页只列现行在栏集合。失败清回批 <b class="危字">${失败.length}</b> 个，其前半影子已整批清回、不在本缓冲，可在探栏台「装载批收口账」只读查看。`;
      const rows = await 探栏.getJSON("/api/入栏缓冲");
      const tb = document.getElementById("表");
      if (!rows.length) { tb.innerHTML = `<tr><td colspan="8">${探栏.空态("缓冲为空：无现行在栏（失败批已清回，影子见收口账）。")}</td></tr>`; return; }
      for (const r of rows) {
        tb.appendChild(探栏.行(
          `<td>${探栏.安全文本(r.报文编号)}</td><td>${探栏.安全文本(r.站点键)}</td>` +
          `<td>${探栏.安全文本(r.指标键)}</td><td>${r.读数}</td><td>${探栏.安全文本(r.栏号)}</td>` +
          `<td>${探栏.安全文本(r.批次编号||"")}</td><td>${探栏.徽章(r.命运)}</td>` +
          `<td>${探栏.收口徽章(批态[r.批次编号]||"整批成功")}</td>`
        ));
      }
    })();
    </script>

  </div>

  <nav class="底栏"><div class="底栏内">
    <a href="/" >探栏台</a>
    <a href="/报文流.html" >报文流</a>
    <a href="/入栏缓冲.html" class="亮">入栏缓冲</a>
    <a href="/站点汇总账.html" >站点汇总账</a>
    <a href="/坏点匣.html" >坏点匣</a>
    <a href="/栏贯验.html" >栏贯验</a>
    <a href="/站点源.html" >站点源</a>
    <a href="/栏规.html" >栏规</a>
  </div></nav>

  <script>
  (async () => {
    try {
      const o = await 探栏.getJSON("/api/概览");
      探栏.渲染门槛(document.getElementById("门槛条"), o.栏规 || {});
    } catch (e) {}
  })();
  </script>
</body>
</html>
